# Builds the iOS app and uploads it to TestFlight (App Store Connect).
# Run it from the Actions tab ("iOS app" → Run workflow), or push a tag like app-v1.0.
#
# Needs these repository secrets (see docs/APP_STORE.md):
#   APPLE_TEAM_ID       your 10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID          App Store Connect API key ID (Users and Access → Integrations → App Store Connect API)
#   ASC_ISSUER_ID       the Issuer ID shown on the same page
#   ASC_KEY_P8          the contents of the downloaded AuthKey_XXXX.p8 file
# The key needs the Admin role: Xcode's cloud signing creates the certificate and profile itself.
name: iOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown on the App Store (e.g. 1.0)
        required: true
        default: '1.0'
  push:
    tags: ['app-v*']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the game and copy it into the app
        run: |
          npm run build
          npx cap sync ios
      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Version and build number
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME#app-v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Version $v, build ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" MARKETING_VERSION="${{ steps.v.outputs.version }}" CURRENT_PROJECT_VERSION="${{ steps.v.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            archive | tail -n 40
          test -d "$RUNNER_TEMP/App.xcarchive"
      - name: Sign and upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ios/ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded. The build appears in App Store Connect → TestFlight after Apple processes it (5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"
