# Tests, builds and deploys the game to Cloudflare Workers (static assets, unicornrush.io).
# Pushes to main go live; pull requests upload a preview version with its own URL.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" token template)
# and CLOUDFLARE_ACCOUNT_ID. The first deploy creates the Worker; nothing to set up by hand.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # Empty on forks and before the secret is set: the deploy step is skipped, the build still runs.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.150.0"
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'versions upload' }}
