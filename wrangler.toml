# Cloudflare Worker: serves the game (static files built to dist/) and runs the
# multiplayer rooms (server/worker.ts, one GameRoom Durable Object per room).
# Deployed by .github/workflows/deploy.yml.
name = "unicornrush"
main = "server/worker.ts"
compatibility_date = "2026-09-01"
# The game lives on unicornrush.io; pull requests still get preview links.
workers_dev = false
preview_urls = true

# Served at unicornrush.io (and www); each deploy keeps the custom domains and their DNS records attached.
# Top-level keys must stay above the [assets] table, or TOML reads them as part of it.
routes = [
  { pattern = "unicornrush.io", custom_domain = true },
  { pattern = "www.unicornrush.io", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"

# Anonymous gameplay events (server/events.ts), read by the private stats page.
# Created on the first deploy.
[[d1_databases]]
binding = "EVENTS"
database_name = "unicornrush-events"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "RoomDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomDirectory"]
